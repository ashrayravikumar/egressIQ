[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egressiq"
version = "0.1.0"
description = "DLP and compliance proxy for GenAI egress traffic"
requires-python = ">=3.9"
dependencies = ["reportlab>=4.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "httpx>=0.24"]
web = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]

[project.scripts]
egressiq = "cli:main_entry"

[tool.setuptools]
py-modules = ["scanner", "report", "cli"]
packages = ["web"]

[tool.setuptools.package-data]
web = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Third-party notice from starlette.testclient (test-only dependency).
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
