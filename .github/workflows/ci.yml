name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Oldest and newest supported versions on macOS as well.
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,web]'

      - name: Test
        run: python -m pytest -q -W error::DeprecationWarning

      - name: CLI smoke test
        run: |
          printf 'contact jane.doe@example.com\nssn 123-45-6789\n' > smoke.txt
          egressiq --file smoke.txt --dry-run --export-pdf smoke.pdf > sanitized.txt
          grep -q '\[REDACTED:EMAIL_ADDRESS\]' sanitized.txt
          grep -q '\[REDACTED:US_SSN\]' sanitized.txt
          if grep -q 'jane.doe@example.com' sanitized.txt; then echo "raw PII leaked"; exit 1; fi
          head -c 4 smoke.pdf | grep -q '%PDF'

      - name: Web UI smoke test
        run: |
          egressiq web --port 8765 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          printf 'key=%s\n' "AKIA""IOSFODNN7EXAMPLE" > drop.log
          curl -sf -F file=@drop.log http://127.0.0.1:8765/api/upload | grep -q '"secrets_blocked":1'
          curl -sf -H 'Content-Type: application/json' -d '{"text":"ssn 123-45-6789"}' \
            http://127.0.0.1:8765/api/report -o web.pdf
          head -c 4 web.pdf | grep -q '%PDF'

  docker:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t egressiq .

      - name: CLI smoke test
        run: |
          mkdir -p data
          printf 'phone=+1-415-555-0198\nkey=%s\n' "AKIA""IOSFODNN7EXAMPLE" > data/log.txt
          # --user so the container can write the PDF into the runner-owned bind mount.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/data:/data" egressiq \
            --file /data/log.txt --dry-run --export-pdf > sanitized.txt
          grep -q '\[REDACTED:PHONE_NUMBER\]' sanitized.txt
          grep -q '\[REDACTED:AWS_ACCESS_KEY_ID\]' sanitized.txt
          head -c 4 data/egressiq_audit_report.pdf | grep -q '%PDF'
          if docker run --rm -i egressiq --dry-run --fail-on-findings < data/log.txt > /dev/null; then
            echo "--fail-on-findings should exit non-zero"; exit 1
          fi

      - name: Web smoke test
        run: |
          docker run -d --name egressiq-web -p 8000:8000 egressiq web
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          docker rm -f egressiq-web
